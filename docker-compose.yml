services:
  grew-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grew-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./users.json:/app/users.json   # Optional: persists user accounts across container rebuilds
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true